[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "inbound-voice-agent"
version = "0.1.0"
description = "AI voice agent that answers call-backs on outbound campaign DIDs (IVR replacement)."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "livekit-agents[google,anthropic,silero,deepgram]>=1.2,<2.0",
    "livekit-plugins-sarvam>=1.2",
    "python-dotenv>=1.0",
    "PyYAML>=6.0",
    "num2words>=0.5.13",
    "aiohttp>=3.9",
    "tzdata>=2024.1",   # Windows has no system timezone database
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23"]

[project.scripts]
inbound-agent = "inbound_agent.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
